name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome != 'success'
        run: sleep 60

      - name: Retry deploy to GitHub Pages
        if: steps.deployment.outcome != 'success'
        id: deployment_retry
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        run: sleep 90

      - name: Final deploy to GitHub Pages
        if: steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        id: deployment_final
        uses: actions/deploy-pages@v5

      - name: Verify deployment succeeded
        if: >-
          steps.deployment.outcome != 'success' &&
          steps.deployment_retry.outcome != 'success' &&
          steps.deployment_final.outcome != 'success'
        run: |
          echo "GitHub Pages deployment failed after 3 attempts."
          echo "The build artifact uploaded successfully; this is a Pages API error."
          exit 1